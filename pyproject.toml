[project]
name = "aflux-bucket"
version = "0.1.2"
description = "aflux-bucket"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "DayNice", email = "76981513+DayNice@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.33",
    "cyclopts>=4.18.0",
    "pydantic>=2.13.4",
    "uuid-utils>=0.14.1",
]

[project.scripts]
aflux-bucket = "aflux_bucket.cli:app"

[project.urls]
Repository = "https://github.com/DayNice/aflux-bucket"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    {"include-group" = "notebook"},
    {"include-group" = "test"},
    {"include-group" = "type"},
]
notebook = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "tqdm>=4.67.3",
]
test = [
    "moto[s3]>=5.1.22",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
type = [
    "types-boto3[s3]>=1.42.68",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 120
extend-include = ["*.ipynb"]

[tool.ruff.lint]
extend-select = ["I", "RUF022"]

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
source_pkgs = ["aflux_bucket"]
branch = true
parallel = true

[tool.coverage.paths]
aflux_bucket = ["src/aflux_bucket", "*/aflux-bucket/src/aflux_bucket"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "^\\s*@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "def __repr__",
    "def __str__",
]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=xml"
